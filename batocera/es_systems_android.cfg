<?xml version="1.0"?>
<!--
  Android apps and games on Batocera and HippOS, run by Lunaria.
  The lunaria service links it to
  /userdata/system/configs/emulationstation/es_systems_android.cfg
-->
<systemList>
  <system>
    <fullname>Android (Lunaria)</fullname>
    <name>android</name>
    <manufacturer>Google</manufacturer>
    <release>2008</release>
    <hardware>console</hardware>
    <path>/userdata/roms/android</path>
    <extension>.apk .APK .xapk .XAPK .apks .APKS .apkm .APKM</extension>
    <command>/bin/bash /userdata/system/lunaria/lunaria-launch.sh %ROM%</command>
    <platform>android</platform>
    <theme>android</theme>
    <emulators>
      <emulator name="lunaria">
        <cores>
          <core default="true">lunaria</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>

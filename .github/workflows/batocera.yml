# The Batocera / HippOS add-on: lunaria-batocera-x86_64.zip and
# lunaria-batocera-aarch64.zip (see batocera/README.md).
#
# Run it from the Actions tab (batocera > Run workflow); the zips are the
# run's artifacts.  A pushed tag also attaches them to that release.
name: batocera

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  addon:
    name: Add-on (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Ubuntu 22.04 (glibc 2.35): the build uses the console's C library,
      # and Batocera and HippOS are both newer than this.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm cmake clang libclang-dev lld \
            pkg-config libssl-dev libglfw3-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libbsd-dev libunwind-dev zlib1g-dev libboost-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev zip

      - name: Build dynarmic
        run: make dynarmic-build

      - name: Build
        run: make -j"$(nproc)" lunaria

      - name: Build guest system libraries
        run: make syslib || echo "syslib unavailable on this runner; shipping without it"

      - name: Test input code
        run: |
          gcc -std=c11 -g -Wall -Wextra -Werror -Isrc test/gamepad_test.c src/luna_input.c -pthread -lm -o test/test_gamepad
          ./test/test_gamepad /tmp/pad.conf
          gcc -std=c11 -g -Wall -Wextra -Isrc test/kedit_test.c src/luna_input.c -pthread -lm -o test/test_kedit
          (cd /tmp && "$GITHUB_WORKSPACE/test/test_kedit")

      - name: Package
        run: |
          make dist
          sh batocera/make-addon.sh out lunaria-*-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: lunaria-batocera-${{ matrix.arch }}
          path: out/lunaria-batocera-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/lunaria-batocera-${{ matrix.arch }}.zip --clobber || true
